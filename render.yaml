services:
  # Ollama Service
  - type: web
    name: clauseguard-ollama
    runtime: docker
    repo: https://github.com/yourusername/clauseguard-ai
    dockerfilePath: ./ollama-service/Dockerfile.ollama
    dockerContext: ./
    envVars:
      - key: OLLAMA_MODEL
        value: qwen2.5:3b-instruct
    disk:
      name: ollama-data
      mountPath: /root/.ollama
      sizeGB: 10

  # Django Web Service
  - type: web
    name: clauseguard-ai
    runtime: docker
    repo: https://github.com/yourusername/clauseguard-ai
    dockerfilePath: ./django-app/Dockerfile.django
    dockerContext: ./
    envVars:
      - key: OLLAMA_URL
        value: http://clauseguard-ollama:11434/api/chat
      - key: OLLAMA_MODEL
        value: qwen2.5:3b-instruct
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false